<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homastar Mini App</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем CSS из папки api -->
    <link rel="stylesheet" href="./api/style.css">
</head>
<body class="theme-night">

    <div class="bg-animated-nebula"></div>
    <div class="floating-particles-container">
        <div class="particle p1">✨</div><div class="particle p2">✦</div><div class="particle p3">✨</div>
    </div>

    <div class="app-container">
        <!-- АКУРАТНАЯ ШАПКА -->
        <header class="header">
            <div class="logo">HOMASTAR</div>
            <div class="balance-group">
                <span id="user-balance-text" class="balance-value">0 ⭐</span>
                <button class="btn-bal-action pay" onclick="openModal('modal-deposit')">+</button>
                <button class="btn-bal-action" onclick="openModal('modal-withdraw')">-</button>
            </div>
        </header>

        <div class="live-bar-embedded">
            <div class="live-marquee-content" id="marquee-content"></div>
        </div>

        <!-- ОСНОВНОЙ ЭКРАН -->
        <div id="screen-hub" class="screen active">
            <h2 style="font-size: 18px; margin-bottom: 5px; padding-left: 5px;">Разделы:</h2>
            <div class="cards-stack">
                <div class="premium-card tier-free-dark" onclick="openFreeWheelScreen()">
                    <div class="p-card-content">
                        <div class="p-card-title-area">
                            <h3>🎁 Бесплатное Колесо</h3>
                            <p>1 раз в 24 часа — бесплатно!</p>
                        </div>
                        <button class="w-card-btn btn-free">ИГРАТЬ</button>
                    </div>
                </div>
                <div class="premium-card tier-common-dark" onclick="openScreen('screen-wheel-list')">
                    <div class="p-card-content">
                        <div class="p-card-title-area">
                            <h3>🎡 Колёса</h3>
                            <p>4 вида: Обычное, Серебряное...</p>
                        </div>
                        <button class="w-card-btn btn-common">ВЫБРАТЬ</button>
                    </div>
                </div>
                <!-- Остальные карточки хаба... -->
            </div>
        </div>

        <!-- СПИСОК ПЛАТНЫХ КОЛЁС -->
        <div id="screen-wheel-list" class="screen">
            <button class="btn-back" onclick="openScreen('screen-hub')">◄ Назад</button>
            <h2 style="font-size: 18px; margin-bottom: 5px;">Колёса:</h2>
            <div class="cards-stack">
                <div class="premium-card tier-common-dark" onclick="openPlayWheel('common')">
                    <div class="p-card-content">
                        <div class="p-card-title-area"><h3>⚡ Обычное</h3><p>Цена: 20 Stars</p></div>
                        <button class="w-card-btn btn-common">ИГРАТЬ</button>
                    </div>
                </div>
                <!-- Серебряное, Золотое, Алмазное... -->
            </div>
        </div>

        <!-- ЭКРАН САМОГО КОЛЕСА -->
        <div id="screen-game-wheel" class="screen">
            <button class="btn-back" onclick="openScreen('screen-wheel-list')" id="btn-back-from-wheel">◄ Назад</button>
            <h2 id="wheel-title" style="text-align: center; font-size: 20px;">Колесо</h2>
            <div id="timer-banner" class="timer-banner">⏱ Доступно через: <span id="timer-countdown">23:59:59</span></div>
            
            <div class="wheel-section">
                <div class="arrow-pointer"></div>
                <div class="wheel-outer-rim">
                    <canvas id="wheel-canvas" width="600" height="600"></canvas>
                </div>
            </div>
            <button id="btn-spin-action" class="btn-spin">ИГРАТЬ</button>
        </div>

        <!-- Модалки выигрыша и пополнения (скрыты по умолчанию) -->
        <div id="modal-win" class="modal-overlay">
            <div class="modal-card win-modal-card">
                <h2 style="font-size: 24px; color: #FFF;">ПОБЕДА!</h2>
                <div class="win-amount" id="win-modal-amount">+50 ⭐</div>
                <button class="btn-spin" onclick="closeModal('modal-win')">ЗАБРАТЬ</button>
            </div>
        </div>

    </div>

    <!-- Подключаем логику JS из папки api -->
    <script src="./api/script.js"></script>
</body>
</html>
