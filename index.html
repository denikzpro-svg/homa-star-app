<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Homastar Mini App</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* =========================================
           ПРЕМИУМ WEB3 ПАЛИТРА И БАЗОВЫЕ СТИЛИ
        ========================================= */
        :root {
            --bg-color: #050711;
            --glass-bg: rgba(12, 16, 28, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-color: #FFFFFF;
            --text-sub: #8B9BB4;
            --neon-cyan: #00F3FF;
            --neon-cyan-glow: rgba(0, 243, 255, 0.4);
            --neon-purple: #A855F7;
            --neon-purple-glow: rgba(168, 85, 247, 0.4);
            --neon-pink: #FF2E93;
            --neon-pink-glow: rgba(255, 46, 147, 0.4);
            --accent-gold: #FFD700;
            --accent-gold-glow: rgba(255, 215, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; position: relative; }
        .app-container { width: 100%; max-width: 420px; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; position: relative; z-index: 2; }

        /* АНИМАЦИИ ФОНА */
        .bg-animated-nebula { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0; background: radial-gradient(circle at 15% 30%, rgba(0, 243, 255, 0.05) 0%, transparent 40%), radial-gradient(circle at 85% 60%, rgba(168, 85, 247, 0.05) 0%, transparent 40%); animation: nebulaPulse 15s ease-in-out infinite alternate; }
        @keyframes nebulaPulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(1.1); opacity: 1; } }

        /* ШАПКА */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0 16px 0; z-index: 10; position: relative; }
        .logo { font-weight: 900; font-size: 20px; letter-spacing: 2px; background: linear-gradient(90deg, #FFFFFF, var(--neon-cyan), #FFFFFF, var(--neon-purple), #FFFFFF); background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientText 5s linear infinite; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        @keyframes gradientText { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
        .balance-group { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 6px 8px 6px 16px; border-radius: 40px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .balance-value { font-size: 15px; font-weight: 900; color: var(--accent-gold); text-shadow: 0 0 15px var(--accent-gold-glow); }
        .btn-bal-action { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: #FFF; font-size: 14px; font-weight: 900; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-bal-action.pay { background: var(--neon-cyan); color: #000; border: none; box-shadow: 0 0 15px var(--neon-cyan-glow); }

        /* ЛЕНТА */
        .live-bar-embedded { width: 100%; display: flex; align-items: center; margin-bottom: 12px; height: 50px; overflow: hidden; position: relative; z-index: 10; -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%); }
        .live-marquee-content { display: flex; gap: 20px; animation: scrollMarquee 900s linear infinite; padding-left: 20px; }
        @keyframes scrollMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .live-pill { display: flex; align-items: center; gap: 6px; padding: 6px 18px; border-radius: 30px; font-weight: 800; font-size: 14px; color: #FFFFFF; white-space: nowrap; background: rgba(10, 15, 30, 0.6); backdrop-filter: blur(10px); border: 1px solid; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        .neon-cyan { border-color: var(--neon-cyan); } .neon-purple { border-color: var(--neon-purple); } .neon-pink { border-color: var(--neon-pink); }

        /* ЭКРАНЫ */
        .screen { display: none; flex-direction: column; flex: 1; overflow-y: auto; padding: 4px 0; z-index: 5; position: relative; }
        .screen::-webkit-scrollbar { display: none; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .screen.active { display: flex; animation: fadeSlideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        /* КАРТОЧКИ ИГР (ХАБ) */
        .cards-stack { display: flex; flex-direction: column; padding-top: 5px; padding-bottom: 20px; }
        .premium-card { height: 160px; border-radius: 24px; position: relative; margin-top: -65px; border: 1px solid rgba(255,255,255,0.05); border-top: 2px solid rgba(255,255,255,0.15); cursor: pointer; padding: 24px 20px; backdrop-filter: blur(20px); overflow: hidden; }
        .premium-card:first-child { margin-top: 0; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        .p-card-bg-icon { position: absolute; right: -10px; top: 20px; font-size: 110px; opacity: 0.04; transform: rotate(15deg); pointer-events: none; z-index: 0; filter: blur(2px); }
        .p-card-content { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 2; height: 100%; }
        .p-card-title-area h3 { font-size: 18px; font-weight: 800; color: #FFF; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
        .p-card-title-area p { font-size: 13px; color: var(--text-sub); font-weight: 600; padding-left: 30px; }
        .w-card-btn { padding: 10px 20px; border-radius: 14px; font-weight: 900; font-size: 12px; border: none; color: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.4); margin-top: 4px; cursor: pointer; }

        .tier-free-dark { background: linear-gradient(135deg, rgba(12, 16, 28, 0.95), rgba(0, 150, 255, 0.2)); border-top-color: var(--neon-cyan); }
        .tier-battle-dark { background: linear-gradient(135deg, rgba(12, 16, 28, 0.95), rgba(255, 46, 147, 0.2)); border-top-color: var(--neon-pink); }
        .btn-free { background: var(--neon-cyan); } .btn-battle { background: var(--neon-pink); color: #FFF; }

        /* =========================================
           АРЕНА (CANVAS + ПИНГ ПОНГ)
        ========================================= */
        .battle-header-info { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); padding: 12px 16px; border-radius: 16px; border: 1px solid var(--glass-border); margin-bottom: 16px; font-weight: 800; }
        
        .arena-wrapper {
            position: relative; width: 100%; aspect-ratio: 1/1; margin-bottom: 16px;
            border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #0B0E17; border: 2px solid var(--glass-border); overflow: hidden;
        }

        /* Сам Canvas (доска + шарик) */
        #arena-canvas { width: 100%; height: 100%; display: block; }

        /* Контейнер для DOM-аватарок поверх Canvas */
        #arena-avatars-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .board-avatar {
            position: absolute; width: 44px; height: 44px; border-radius: 50%; 
            border: 2px solid #FFF; display: flex; justify-content: center; align-items: center; 
            font-size: 16px; font-weight: bold; overflow: hidden;
            transform: translate(-50%, -50%); box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.5s ease;
        }

        /* Таймер в центре */
        .board-timer {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: rgba(10, 15, 30, 0.8); backdrop-filter: blur(5px); 
            border-radius: 50%; border: 2px solid var(--glass-border); display: flex; justify-content: center; 
            align-items: center; font-size: 32px; font-weight: 900; color: #FFF; box-shadow: 0 0 20px rgba(0,0,0,0.5); z-index: 10;
        }

        /* Окно результата */
        .board-overlay-result {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 20;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; animation: fadeInResult 0.3s ease-out;
        }
        @keyframes fadeInResult { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* Кнопка реакций на поле */
        .arena-reaction-btn {
            position: absolute; bottom: 10px; right: 10px; width: 44px; height: 44px;
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 20px; cursor: pointer; z-index: 30; transition: 0.2s;
        }
        .arena-reaction-btn:active { transform: scale(0.9); }
        
        /* Панель выбора реакций */
        .reaction-picker {
            position: absolute; bottom: 60px; right: 10px; display: none; gap: 8px;
            background: rgba(10, 15, 30, 0.9); padding: 8px; border-radius: 20px;
            border: 1px solid var(--glass-border); backdrop-filter: blur(10px); z-index: 30;
            animation: popUpPicker 0.2s ease-out;
        }
        @keyframes popUpPicker { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .emoji-option { font-size: 24px; cursor: pointer; transition: 0.2s; }
        .emoji-option:active { transform: scale(1.3); }

        /* Анимация летящих эмодзи */
        .flying-emoji {
            position: absolute; font-size: 24px; pointer-events: none; z-index: 25;
            animation: flyUpAndFade 2s ease-out forwards;
        }
        @keyframes flyUpAndFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -80%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -200%) scale(1); }
        }

        /* Список игроков */
        .b-players-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 140px; overflow-y: auto; padding-right: 5px; }
        .b-players-list::-webkit-scrollbar { width: 4px; }
        .b-players-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        .b-player-row { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); padding: 10px 14px; border-radius: 16px; border: 1px solid var(--glass-border); animation: fadeSlideIn 0.3s ease-out forwards; }
        .b-player-ava { width: 34px; height: 34px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; overflow: hidden; border: 2px solid; }
        .b-player-info h4 { font-size: 13px; font-weight: 800; margin-bottom: 2px; display:flex; align-items:center; gap:6px; }
        .b-player-bet { font-size: 14px; font-weight: 900; color: var(--accent-gold); }

        /* КАСТОМНАЯ СТАВКА (Нижняя панель) */
        .b-bet-controls { display: flex; gap: 8px; margin-bottom: 8px; }
        .b-quick-btn { flex: 1; padding: 10px 0; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 14px; color: #FFF; font-weight: 800; cursor: pointer; transition: 0.2s; font-size: 13px; }
        
        .custom-bet-row { display: flex; gap: 8px; }
        .custom-bet-input { 
            flex: 1; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); 
            border-radius: 16px; padding: 14px 16px; color: var(--accent-gold); font-size: 16px; 
            font-weight: 900; text-align: center;
        }
        .custom-bet-submit { 
            width: 140px; background: var(--neon-pink); color: #FFF; font-weight: 900; 
            border: none; border-radius: 16px; cursor: pointer; box-shadow: 0 0 15px var(--neon-pink-glow); 
        }
        .custom-bet-submit.disabled { background: var(--glass-bg); color: var(--text-sub); box-shadow: none; pointer-events: none; border: 1px solid var(--glass-border); }

        /* НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ */
        .bottom-nav { display: flex; justify-content: space-between; background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 12px 16px; border-radius: 28px; position: relative; z-index: 10; margin-top: auto; }
        .nav-item { background: transparent; border: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 20px; color: var(--text-sub); opacity: 0.5; cursor: pointer; flex: 1; }
        .nav-label { font-size: 10px; font-weight: 800; }
        .nav-item.active { opacity: 1; color: var(--neon-cyan); transform: translateY(-4px); }
    </style>
</head>
<body class="theme-night">

    <div class="bg-animated-nebula"></div>

    <div class="app-container">
        <!-- ШАПКА -->
        <header class="header">
            <div class="logo">HOMASTAR</div>
            <div class="balance-group">
                <span id="user-balance-text" class="balance-value">0 ⭐</span>
                <button class="btn-bal-action pay" onclick="alert('Пополнение в демо отключено')">+</button>
                <button class="btn-bal-action" onclick="alert('Вывод в демо отключен')">-</button>
            </div>
        </header>

        <!-- ХАБ И ДРУГИЕ ОКНА СКРЫТЫ ДЛЯ ФОКУСА НА АРЕНЕ (Демо) -->
        <div id="screen-hub" class="screen">
            <h2 style="font-size: 18px; margin-bottom: 5px;">Разделы:</h2>
            <div class="cards-stack">
                <div class="premium-card tier-battle-dark" onclick="openScreen('screen-battle')">
                    <div class="p-card-bg-icon">🏓</div><div class="p-card-content">
                        <div class="p-card-title-area"><h3><span class="t-icon">🏓</span> Арена</h3><p>PVP Рулетка с игроками!</p></div>
                        <button class="w-card-btn btn-battle">ИГРАТЬ</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ======================= -->
        <!-- АРЕНА (ПИНГ-ПОНГ НА CANVAS) -->
        <!-- ======================= -->
        <div id="screen-battle" class="screen active">
            <div class="battle-header-info">
                <span style="color: var(--text-sub); font-size:14px;">Общий Банк:</span>
                <span id="arena-total-bank" style="color: var(--accent-gold); font-size: 18px;">⭐ 0</span>
            </div>
            
            <div class="arena-wrapper" id="arena-wrapper">
                <!-- CANVAS ДЛЯ ИДЕАЛЬНЫХ ЛИНИЙ И ШАРИКА -->
                <canvas id="arena-canvas" width="600" height="600"></canvas>
                
                <!-- СЛОЙ ДЛЯ АВАТАРОК И ЭМОДЗИ -->
                <div id="arena-avatars-layer"></div>
                
                <div class="board-timer" id="arena-timer">20</div>
                
                <!-- АВТОМАТИЧЕСКОЕ ОКНО ПОБЕДЫ -->
                <div class="board-overlay-result" id="arena-overlay"></div>

                <!-- КНОПКА ЭМОЦИЙ -->
                <div class="arena-reaction-btn" onclick="toggleReactionPicker()">💬</div>
                <div class="reaction-picker" id="reaction-picker">
                    <div class="emoji-option" onclick="sendReaction('🔥')">🔥</div>
                    <div class="emoji-option" onclick="sendReaction('👍')">👍</div>
                    <div class="emoji-option" onclick="sendReaction('😂')">😂</div>
                    <div class="emoji-option" onclick="sendReaction('🚀')">🚀</div>
                    <div class="emoji-option" onclick="sendReaction('🤬')">🤬</div>
                </div>
            </div>
            
            <div class="b-players-list" id="arena-players-list"></div>

            <!-- БЫСТРЫЕ СТАВКИ -->
            <div class="b-bet-controls">
                <button class="b-quick-btn" onclick="document.getElementById('arena-bet-input').value = 50">50</button>
                <button class="b-quick-btn" onclick="document.getElementById('arena-bet-input').value = 100">100</button>
                <button class="b-quick-btn" onclick="document.getElementById('arena-bet-input').value = 500">500</button>
                <button class="b-quick-btn" onclick="document.getElementById('arena-bet-input').value = Math.floor(userBalance)">MAX</button>
            </div>
            
            <!-- КАСТОМНЫЙ ВВОД СТАВКИ -->
            <div class="custom-bet-row">
                <input type="number" id="arena-bet-input" class="custom-bet-input" placeholder="Сумма ⭐">
                <button class="custom-bet-submit" id="arena-action-btn" onclick="placeUserBet()">ПОСТАВИТЬ</button>
            </div>
        </div>

        <!-- НИЖНЯЯ ПАНЕЛЬ -->
        <nav class="bottom-nav">
            <button class="nav-item active"><span>🎮</span><span class="nav-label">Арена</span></button>
        </nav>
    </div>

    <script>
        // Базовый баланс для теста
        let userBalance = parseFloat(localStorage.getItem('homastar_main_balance') || '2500');
        
        function updateBalanceDisplay() {
            document.getElementById('user-balance-text').innerText = `${userBalance % 1 === 0 ? userBalance : userBalance.toFixed(1)} ⭐`;
            localStorage.setItem('homastar_main_balance', userBalance.toString());
        }
        updateBalanceDisplay();

        // ==========================================
        // CANVAS АРЕНА (ДВИЖОК ПИНГ-ПОНГА)
        // ==========================================
        const canvas = document.getElementById('arena-canvas');
        const ctx = canvas.getContext('2d');
        const CANVAS_SIZE = 600; // Высокое разрешение для чёткости
        const CENTER = CANVAS_SIZE / 2;
        
        // База ботов
        const fakeBotNames = ['Max_99', 'Илья', 'Vityok', 'Artem', '@crypto_bull', 'Ton_Hunter', '0x_Whale', 'Ghost', 'Denys'];
        const arenaColors = ['#00F3FF', '#FF2E93', '#A855F7', '#00FF88', '#FF6600'];
        const botEmojis = ['🔥', '👍', '😂', '🚀', '😭', '😎'];
        
        let arenaPlayers = [];
        let arenaTimer = null;
        let arenaTimeLeft = 20;
        let arenaBank = 0;
        let arenaState = 'STOPPED'; // WAITING, PLAYING, RESULT
        let botCount = 0;
        
        // Переменные физики шарика
        let animFrameId = null;
        let ballX = CENTER;
        let ballY = CENTER;
        let ballRadius = 14;
        let ballSpeedX = 0;
        let ballSpeedY = 0;

        function openScreen(id) { document.getElementById(id).classList.add('active'); }

        // Генерация бота с некруглыми ставками
        function generateBotPlayer() {
            const name = fakeBotNames[Math.floor(Math.random() * fakeBotNames.length)];
            // Генерируем "кривые" ставки (например: 34, 86, 114, 255)
            const bet = Math.floor(Math.random() * 300) + 20; 
            const color = arenaColors[botCount % arenaColors.length]; 
            const imgId = Math.floor(Math.random() * 70) + 1;
            const avatarHtml = `<img src="https://i.pravatar.cc/100?img=${imgId}" style="width:100%; height:100%; object-fit:cover;">`;
            
            return { id: 'bot_'+botCount, name, bet, color, avatarHtml, isUser: false };
        }

        // 1. ЗАПУСК РАУНДА
        function startArenaRound() {
            arenaState = 'WAITING';
            arenaTimeLeft = 20;
            arenaBank = 0;
            arenaPlayers = [];
            botCount = 0;
            
            document.getElementById('arena-players-list').innerHTML = '';
            document.getElementById('arena-total-bank').innerText = '⭐ 0';
            document.getElementById('arena-overlay').style.display = 'none';
            document.getElementById('arena-timer').style.display = 'flex';
            document.getElementById('arena-bet-input').value = '';
            
            const btn = document.getElementById('arena-action-btn');
            btn.classList.remove('disabled');
            btn.innerText = 'ПОСТАВИТЬ';
            
            // Прячем шарик (отрисовываем пустое поле)
            ballX = CENTER; ballY = CENTER;
            drawCanvasFrame(); 

            // Первый бот для затравки
            addBotToArena();

            arenaTimer = setInterval(() => {
                arenaTimeLeft--;
                document.getElementById('arena-timer').innerText = arenaTimeLeft;
                
                // Боты влетают рандомно (максимум 3)
                if (botCount < 3 && arenaTimeLeft > 3 && Math.random() > 0.6) {
                    addBotToArena();
                }

                // Боты иногда кидают реакции
                if (arenaPlayers.length > 0 && Math.random() > 0.7) {
                    let randomBot = arenaPlayers[Math.floor(Math.random() * arenaPlayers.length)];
                    if(!randomBot.isUser) {
                        let randomEmoji = botEmojis[Math.floor(Math.random() * botEmojis.length)];
                        spawnEmojiFromPlayer(randomBot, randomEmoji);
                    }
                }

                if (arenaTimeLeft <= 0) {
                    clearInterval(arenaTimer);
                    endBettingPhase(); 
                }
            }, 1000);
        }

        function addBotToArena() {
            botCount++;
            const bot = generateBotPlayer();
            arenaPlayers.push(bot);
            arenaBank += bot.bet;
            recalculateSectors();
            addPlayerToUI(bot);
        }

        // Пользователь ставит кастомную сумму
        function placeUserBet() {
            if(arenaState !== 'WAITING') return;
            if (arenaPlayers.find(p => p.isUser)) return alert('Ты уже в игре!');

            const inputVal = parseFloat(document.getElementById('arena-bet-input').value);
            if (!inputVal || inputVal <= 0) return alert('Введите сумму!');
            if (userBalance < inputVal) return alert('Недостаточно средств!');

            userBalance -= inputVal;
            updateBalanceDisplay();
            
            const userPlayer = {
                id: 'user', name: 'Деня', bet: inputVal, color: '#FFD700', isUser: true,
                avatarHtml: `<div style="width:100%; height:100%; background:var(--accent-gold-glow); color:#000; display:flex; justify-content:center; align-items:center;">Д</div>`
            };
            
            arenaPlayers.push(userPlayer);
            arenaBank += inputVal;
            recalculateSectors(); 
            addPlayerToUI(userPlayer);
            
            const btn = document.getElementById('arena-action-btn');
            btn.classList.add('disabled');
            btn.innerText = 'ПРИНЯТО';
        }

        function addPlayerToUI(p) {
            const list = document.getElementById('arena-players-list');
            const row = document.createElement('div');
            row.className = 'b-player-row';
            row.innerHTML = `
                <div class="b-player-left">
                    <div class="b-player-ava" style="border-color: ${p.color}; box-shadow: 0 0 10px ${p.color}80;">${p.avatarHtml}</div>
                    <div class="b-player-info">
                        <h4>${p.name} <span id="ui-perc-${p.id}" style="color:var(--neon-cyan); font-weight:900;">0%</span></h4>
                    </div>
                </div>
                <div class="b-player-bet">⭐ ${p.bet}</div>
            `;
            list.prepend(row);
        }

        // 2. ОТРИСОВКА ИДЕАЛЬНЫХ СЕКТОРОВ НА CANVAS
        function recalculateSectors() {
            if (arenaPlayers.length === 0) return;
            let currentAngle = -Math.PI / 2; // Начинаем с 12 часов
            
            const avatarsContainer = document.getElementById('arena-avatars-layer');
            avatarsContainer.innerHTML = ''; 

            arenaPlayers.forEach(p => {
                let sliceAngle = (p.bet / arenaBank) * (2 * Math.PI);
                
                // Сохраняем математику для шарика
                p.startRad = currentAngle;
                p.endRad = currentAngle + sliceAngle;
                p.midRad = currentAngle + (sliceAngle / 2);
                
                // Высчитываем координаты для аватарок (в процентах для DOM)
                let radiusOffset = 32; // Отступ от центра
                let x = 50 + radiusOffset * Math.cos(p.midRad);
                let y = 50 + radiusOffset * Math.sin(p.midRad);
                
                p.domX = x; p.domY = y; // Сохраняем для спавна эмодзи

                let ava = document.createElement('div');
                ava.className = 'board-avatar';
                ava.style.left = `${x}%`; ava.style.top = `${y}%`; ava.style.borderColor = p.color;
                ava.innerHTML = p.avatarHtml;
                avatarsContainer.appendChild(ava);

                currentAngle += sliceAngle;
                
                // Обновляем проценты в UI
                const percEl = document.getElementById(`ui-perc-${p.id}`);
                if(percEl) percEl.innerText = `${((p.bet / arenaBank)*100).toFixed(1)}%`;
            });

            document.getElementById('arena-total-bank').innerText = `⭐ ${arenaBank}`;
            drawCanvasFrame(); // Отрисовываем доску
        }

        function drawCanvasFrame() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            // Отрисовка секторов (Pie Chart)
            if (arenaPlayers.length > 0) {
                arenaPlayers.forEach(p => {
                    ctx.beginPath();
                    ctx.moveTo(CENTER, CENTER);
                    ctx.arc(CENTER, CENTER, CENTER, p.startRad, p.endRad);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    
                    // Белые неоновые разделители между секторами
                    ctx.beginPath();
                    ctx.moveTo(CENTER, CENTER);
                    ctx.lineTo(CENTER + Math.cos(p.endRad) * CENTER, CENTER + Math.sin(p.endRad) * CENTER);
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.stroke();
                });
            } else {
                ctx.fillStyle = '#1A2235';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            }

            // Отрисовка шарика (только если играем)
            if (arenaState === 'PLAYING') {
                ctx.beginPath();
                ctx.arc(ballX, ballY, ballRadius, 0, 2 * Math.PI);
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = '#00F3FF';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0; // Сброс теней
            }
        }

        // 3. ФИЗИКА ШАРИКА (ПИНГ-ПОНГ)
        function endBettingPhase() {
            arenaState = 'PLAYING';
            document.getElementById('arena-timer').style.display = 'none';
            document.getElementById('reaction-picker').style.display = 'none'; // Прячем панель эмоций
            document.getElementById('arena-action-btn').classList.add('disabled');
            document.getElementById('arena-action-btn').innerText = 'ШАРИК В ИГРЕ...';

            // Выбор победителя (без комиссии, весь банк)
            let rand = Math.random() * arenaBank;
            let winner;
            for(let p of arenaPlayers) {
                if(rand < p.bet) { winner = p; break; }
                rand -= p.bet;
            }
            if(!winner) winner = arenaPlayers[arenaPlayers.length-1];

            // Стартовый пинок шарика
            ballSpeedX = (Math.random() > 0.5 ? 1 : -1) * (8 + Math.random() * 4);
            ballSpeedY = (Math.random() > 0.5 ? 1 : -1) * (8 + Math.random() * 4);
            let startTime = null;
            let bouncePhase = true; // true = летает, false = летит к победителю

            function animateBall(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;

                if (bouncePhase) {
                    ballX += ballSpeedX;
                    ballY += ballSpeedY;

                    // Рикошеты от квадратных бортов Canvas
                    if (ballX <= ballRadius || ballX >= CANVAS_SIZE - ballRadius) ballSpeedX *= -1;
                    if (ballY <= ballRadius || ballY >= CANVAS_SIZE - ballRadius) ballSpeedY *= -1;

                    // Через 3.5 секунды переходим в режим торможения в сектор победителя
                    if (progress > 3500) {
                        bouncePhase = false;
                    }
                } else {
                    // Магнитится к аватарке победителя (Smooth Lerp)
                    let targetX = CENTER + Math.cos(winner.midRad) * (CENTER * 0.64);
                    let targetY = CENTER + Math.sin(winner.midRad) * (CENTER * 0.64);
                    
                    ballX += (targetX - ballX) * 0.05;
                    ballY += (targetY - ballY) * 0.05;

                    // Проверяем, остановился ли шарик (почти долетел)
                    if (Math.abs(targetX - ballX) < 1 && Math.abs(targetY - ballY) < 1) {
                        cancelAnimationFrame(animFrameId);
                        drawCanvasFrame(); // Последний кадр
                        setTimeout(() => showArenaResult(winner), 500);
                        return; // Останавливаем луп
                    }
                }

                drawCanvasFrame();
                animFrameId = requestAnimationFrame(animateBall);
            }
            
            animFrameId = requestAnimationFrame(animateBall);
        }

        // 4. РЕЗУЛЬТАТ И ПОВТОР
        function showArenaResult(winner) {
            arenaState = 'RESULT';
            
            const overlay = document.getElementById('arena-overlay');
            overlay.style.display = 'flex';
            
            if (winner.isUser) {
                userBalance += arenaBank; // Забирает 100% банка!
                updateBalanceDisplay();
                overlay.innerHTML = `<h3 style="color:var(--accent-gold); font-size:24px; text-shadow:0 0 15px var(--accent-gold-glow);">ТВОЙ БАНК!</h3><div style="font-size:20px; font-weight:900;">+${arenaBank} ⭐</div>`;
                spawnEmojiFromPlayer(winner, '🤑');
            } else {
                overlay.innerHTML = `<h3 style="color:#FFF; font-size:18px;">Победил ${winner.name}</h3><div style="font-size:16px; color:var(--accent-gold); font-weight:800;">Забрал ${arenaBank} ⭐</div>`;
            }

            // Перезапуск через 3 сек
            setTimeout(() => {
                if (document.getElementById('screen-battle').classList.contains('active')) {
                    startArenaRound();
                } else {
                    arenaState = 'STOPPED'; 
                }
            }, 3000);
        }

        // ==========================================
        // ЖИВЫЕ РЕАКЦИИ (ЭМОДЗИ)
        // ==========================================
        function toggleReactionPicker() {
            if(arenaState !== 'WAITING') return;
            const picker = document.getElementById('reaction-picker');
            picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
        }

        function sendReaction(emoji) {
            document.getElementById('reaction-picker').style.display = 'none';
            // Ищем игрока в массиве
            let userObj = arenaPlayers.find(p => p.isUser);
            if(userObj) {
                spawnEmojiFromPlayer(userObj, emoji);
            } else {
                // Если игрок еще не поставил ставку, спавним просто снизу
                spawnFloatingEmoji(emoji, 50, 90);
            }
        }

        function spawnEmojiFromPlayer(playerObj, emoji) {
            // Спавним эмодзи по координатам аватарки игрока
            spawnFloatingEmoji(emoji, playerObj.domX, playerObj.domY);
        }

        function spawnFloatingEmoji(emojiText, leftPerc, topPerc) {
            const layer = document.getElementById('arena-avatars-layer');
            const el = document.createElement('div');
            el.className = 'flying-emoji';
            el.innerText = emojiText;
            el.style.left = `${leftPerc}%`;
            el.style.top = `${topPerc}%`;
            layer.appendChild(el);
            
            // Удаляем из DOM после завершения анимации
            setTimeout(() => el.remove(), 2000);
        }

        // Автозапуск при загрузке
        window.onload = function() {
            startArenaRound();
            if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }
        };
    </script>
